name: Validate Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify workflow action pins
        shell: bash
        run: |
          unpinned="$(
            grep -R -nE '^[[:space:]]*uses:[[:space:]]+[^[:space:]#]+@[^[:space:]#]+' .github/workflows \
              --include='*.yml' --include='*.yaml' |
              grep -vE '@[0-9a-f]{40}([[:space:]]+#.*)?$' || true
          )"
          if [[ -n "$unpinned" ]]; then
            printf 'Workflow actions must use full commit SHAs:\n%s\n' "$unpinned"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with GitHub Pages
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Verify generated pages
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/docs/workstation.html
          grep -F "Maintained forks" _site/index.html
          grep -F "ModernDriverManagement" _site/index.html
