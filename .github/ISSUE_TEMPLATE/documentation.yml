name: Profile or documentation issue
description: Report an incorrect link, project detail, accessibility issue, or website problem.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Use the affected tool repository for script behavior or deployment support.
        Do not disclose vulnerabilities or sensitive deployment data here; follow SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GitHub profile README
        - GitHub Pages website
        - Workstation guide
        - Project or fork metadata
        - Accessibility or branding
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or link
      description: Provide the affected URL or repository path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is incorrect?
      description: Describe the current behavior and the expected correction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Include public documentation or reproducible steps when available.
